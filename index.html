<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="author" content="Mohammad Reza Rajabi" />
    <meta
      name="description"
      content="Personal portfolio of Mohammad Reza Rajabi."
    />

    <title>Mohammad Reza Rajabi | Portfolio</title>

    <link rel="icon" href="./assets/icons/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="./css/style.css" />
  </head>

  <body data-theme="dark">
    <div class="container p-2">
      <header class="header flex justify-between items-center mt-2 mb-6">
        <div class="div_header_logo flex items-center gap-1">
          <img src="./assets/images/Logo.webp" width="55" class="Logo_header" />
        </div>
        <div class="menuBar_header">
          <ul class="menuBar flex gap-4">
            <li class="menuBar_list">Home</li>
            <li class="menuBar_list">Project</li>
            <li class="menuBar_list">Skills</li>
            <li class="menuBar_list">About</li>
            <li class="menuBar_list">Service</li>
            <li class="menuBar_list">Certificates</li>
            <li class="menuBar_list">Contact</li>
          </ul>
        </div>
        <div class="changeBtns">
          <button
            type="button"
            class="switch-lang"
            aria-label="Switch language"
            aria-pressed="false"
          >
            <span class="lang-label en-label">EN</span>
            <span class="lang-label fa-label">FA</span>
            <span class="switch-lang-thumb"></span>
          </button>

          <button
            type="button"
            class="dark-mode"
            aria-label="Toggle dark mode"
            aria-pressed="false"
          >
            <!-- Moon -->
            <svg
              class="theme-icon moon-icon"
              xmlns="http://www.w3.org/2000/svg"
              width="20"
              height="20"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path
                d="M20.9 13.1A8.5 8.5 0 0 1 10.9 3.1a8.5 8.5 0 1 0 10 10Z"
              />
            </svg>

            <!-- Sun -->
            <svg
              class="theme-icon sun-icon"
              xmlns="http://www.w3.org/2000/svg"
              width="20"
              height="20"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <circle cx="12" cy="12" r="4" />
              <path
                d="M12 2v2m0 16v2M4.93 4.93l1.42 1.42m11.3 11.3 1.42 1.42M2 12h2m16 0h2M4.93 19.07l1.42-1.42m11.3-11.3 1.42-1.42"
              />
            </svg>
          </button>
        </div>
      </header>
      <div class="line mb-6"></div>
    </div>

    <script type="module" src="./js/main.js"></script>
  </body>
</html>
